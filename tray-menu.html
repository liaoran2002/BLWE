<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>托盘菜单</title>
    <style>
      /*
        自绘托盘菜单

        为什么要自绘、而不是用原生 Menu.popup：
        壁纸模式开着鼠标转发（electron-as-wallpaper 会 RIDEV_INPUTSINK 全系统鼠标事件、
        再合成点击塞进壁纸窗口），原生弹出菜单会被这些合成点击当场关掉。
        这个页面跑在**独立的置顶窗口**里，收的是真实鼠标消息，所以菜单项点得动。
      */
      :root {
        --glass-rgb: 32, 32, 38;
        --text-rgb: 255, 255, 255;
        --glass-alpha: 0.72;
        --accent: 111, 140, 255;
        --danger: 208, 48, 80;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
        font: 13px/1.4 system-ui, 'Microsoft YaHei', sans-serif;
      }
      #menu {
        margin: 0;
        padding: 6px;
        border-radius: 10px;
        color: rgb(var(--text-rgb));
        background: rgba(var(--glass-rgb), calc(var(--glass-alpha) + 0.2));
        border: 1px solid rgba(var(--text-rgb), 0.14);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      }
      .item {
        display: flex;
        align-items: center;
        /* 文字居中（用户要求）：菜单项是纯文本，没有左右分栏的子元素 */
        justify-content: center;
        text-align: center;
        gap: 8px;
        height: 30px;
        padding: 0 10px;
        border-radius: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /*
        定时那一项：倒计时蓝色、归零红色（用户要求）

        `timer-zero` 对应 `00:00` —— 倒计时结束、正在等视频播完的那一段，
        面板里同样是红色 `00:00`，两处必须一致。
      */
      .item.timer-running {
        color: #6ba8ff;
      }
      .item.timer-zero {
        color: #ff5c5c;
      }
      .item:hover {
        background: rgba(var(--accent), 0.28);
      }
      .item:active {
        background: rgba(var(--accent), 0.45);
      }
      .item .label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item .hint {
        opacity: 0.55;
        font-size: 12px;
      }
      .item.danger:hover {
        background: rgba(var(--danger), 0.42);
      }
      .now {
        padding: 2px 10px 6px;
        font-size: 12px;
        opacity: 0.75;
        /* 和菜单项一起居中，否则顶部标题左对齐、下面居中会显得歪 */
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* —— 进度条 —— */
      .seek {
        padding: 0 10px;
      }
      .seek-track {
        position: relative;
        height: 14px;
        display: flex;
        align-items: center;
        cursor: pointer;
        touch-action: none;
      }
      .seek-track::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        border-radius: 2px;
        background: rgba(var(--text-rgb), 0.25);
      }
      .seek-fill {
        position: relative;
        height: 4px;
        border-radius: 2px;
        background: rgb(var(--text-rgb));
      }
      .seek-thumb {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        border-radius: 50%;
        background: rgb(var(--text-rgb));
        transform: translateY(-50%);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.12s;
      }
      .seek:hover .seek-thumb,
      .seek-track:active .seek-thumb {
        opacity: 1;
      }
      .time {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 10px 4px;
        font-size: 11px;
        opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }
      /* 左边已播、右边总长（两端对齐，中间不加 `/`） */
      .time .t-total {
        opacity: 0.85;
      }
      /* —— 控制按钮那一行 —— */
      .controls {
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 2px 6px 4px;
      }
      .controls i {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 30px;
        font-size: 19px;
        border-radius: 6px;
        cursor: pointer;
      }
      .controls i:hover {
        background: rgba(var(--accent), 0.28);
      }
      .controls i:active {
        background: rgba(var(--accent), 0.45);
      }
      /* —— 音量：按钮 + 悬停出现的横条 —— */
      .volume {
        position: relative;
        display: inline-flex;
      }
      /* 横向弹出条：留在面板内部，不会被窗口边界裁掉；左边是音量数字 */
      .volume-pop {
        position: absolute;
        bottom: 100%;
        left: -8px;
        width: 168px;
        height: 26px;
        padding: 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 8px;
        background: rgba(var(--glass-rgb), 0.94);
        border: 1px solid rgba(var(--text-rgb), 0.14);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s;
      }
      .volume-num {
        width: 26px;
        text-align: right;
        font-size: 11px;
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
      }
      .volume:hover .volume-pop {
        opacity: 1;
        pointer-events: auto;
      }
      .volume-track {
        position: relative;
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: rgba(var(--text-rgb), 0.25);
        cursor: pointer;
        touch-action: none;
      }
      .volume-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        border-radius: 2px;
        background: rgb(var(--text-rgb));
      }
      .volume-thumb {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        border-radius: 50%;
        background: rgb(var(--text-rgb));
        transform: translateY(-50%);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      /* —— 下面那几项 —— */
      .list {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid rgba(var(--text-rgb), 0.14);
      }
    </style>
  </head>
  <body>
    <div id="menu"></div>
    <script type="module" src="/src/trayMenu/main.ts"></script>
  </body>
</html>
