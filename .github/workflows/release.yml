name: release

# 每次 push 到 main 就重新打一份包，覆盖同一个 "latest" 发布。
#
# 为什么是「覆盖同一个 release」而不是「一 commit 一个 tag」：
#   - 应用是靠 `releases/latest` 找指纹的，一 commit 一个 release 会让列表很快堆满；
#   - 版本号常年不变（1.0.0），tag 也就没法用版本号区分；
#   - 覆盖之后 `latest` 永远指向最新一次构建，用户点开只有一个下载入口。
#
# 指纹每次构建都会变（protect + asar），所以**任一代码改动都会让已安装的用户看到一次更新提示**。
# 如果只是改文档，走下面的 paths-ignore，不会触发构建。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'screenshot/**'
  # 允许在 Actions 页面手动点一下重发
  workflow_dispatch:

permissions:
  # 发 release 需要写 contents
  contents: write

# 连续 commit 时只保留最后一次：旧的那次没必要再打包装一次
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 打包的是 Windows 产物（nsis + portable），必须在 Windows 上打
    runs-on: windows-latest
    steps:
      # v5 起跑在 node24 运行时上；v4 是 node20（GitHub 已弃用并强推到 node24，会打警告）
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Electron 的二进制（~100MB）和 NSIS 工具每次重新下会很慢，缓存住
      - name: 缓存 Electron / electron-builder 的下载产物
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # dist = electron-vite 构建 → protect（字节码/混淆/加密）→ electron-builder → 生成指纹
      - name: 打包 + 生成指纹
        run: npm run dist

      # 覆盖式发布：先删掉同名 release（连 tag 一起），再用当前 commit 重建
      - name: 覆盖 latest 发布
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 第一次跑的时候还没有 latest，删除会失败，这里不当错误
          gh release delete latest --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host '还没有 latest 发布，直接新建' }

          $files = @(Get-ChildItem -Path release -Filter *.exe | ForEach-Object { $_.FullName })

          # 版本号从 package.json 读，别写死：包名就是 `${productName} ${version}.exe`
          # （便携版）和 `${productName} Setup ${version}.exe`（安装版）。
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # 指纹就一行：sha256/大小/构建时间戳。应用端按 `/` 切开取第一段比对，
          # 后两段留给人工核对。不再另传 fingerprint.json 附件。
          $fp = Get-Content release/fingerprint.json -Raw | ConvertFrom-Json
          $notes = "$($fp.sha256)/$($fp.size)/$($fp.builtAt)`n`n" +
                   "BLWE $($version).exe 为便携版，BLWE Setup $($version).exe 为安装版；`n" +
                   "按需求下载即可。"

          # 固定 tag：latest。没有它就先建，有就先删（上一步连 tag 一起删掉了），
          # 所以这个 tag 永远指向最新一次构建出来的 commit。
          gh release create latest $files `
            --target "${{ github.sha }}" `
            --title "latest build" `
            --notes $notes
